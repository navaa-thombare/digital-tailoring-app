name: storemanagement
description: Offline-first multi-store management Android application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bcrypt: ^1.1.3
  crypto: ^3.0.3
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^1.0.1
  uuid: ^4.4.2
  printing: ^5.14.3
  pdf: ^3.12.0
  barcode: ^2.2.9
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
